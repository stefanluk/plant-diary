# Example dashboard card. Entity ids depend on your plant names; adjust after installing.
type: vertical-stack
cards:
  - type: markdown
    content: >
      ## 🪴 Planten
      {% set n = states('sensor.planten_water_nodig') | int(0) %}
      {% if n > 0 %}**{{ n }} planten hebben water nodig:**
      {{ state_attr('sensor.planten_water_nodig', 'plants') | join(', ') }}
      {% else %}Alles is verzorgd 🎉{% endif %}
  - type: entities
    title: Volgende water
    entities:
      - sensor.my_plant_volgende_water
      - button.my_plant_water_gegeven
      - sensor.other_plant_volgende_water
      - button.other_plant_water_gegeven
