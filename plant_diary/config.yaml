name: Plant Diary
version: "0.11.2"
slug: plant_diary
description: Houseplant diary and watering schedule with MQTT sensors and push reminders
url: https://github.com/stefanluk/plant-diary
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:flower
homeassistant_api: true
map:
  - addon_config:rw
services:
  - mqtt:want
options:
  notify_service: ""
  notify_hour: 9
  language: nl
schema:
  notify_service: str?
  notify_hour: int(0,23)
  language: list(en|nl)
