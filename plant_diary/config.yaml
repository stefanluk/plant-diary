name: Plantendagboek
version: "0.8.7"
slug: plant_diary
description: Houseplant diary and watering schedule with MQTT sensors and push reminders
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:flower
homeassistant_api: true
map:
  - addon_config:rw
services:
  - mqtt:want
options:
  notify_service: ""
  notify_hour: 9
schema:
  notify_service: str?
  notify_hour: int(0,23)
