<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantendagboek</title>
<style>
  :root { --g:#2e7d32; --bg:#f4f6f1; --c:#fff; --r:#c62828; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px system-ui,sans-serif; background:var(--bg); color:#222; }
  header { background:var(--g); color:#fff; padding:12px 16px; display:flex; gap:12px; align-items:center; position:sticky; top:0; z-index:2; }
  header h1 { font-size:18px; margin:0; flex:1; }
  button { font:inherit; padding:8px 12px; border:0; border-radius:8px; background:var(--g); color:#fff; }
  button.sec { background:#e0e6da; color:#222; }
  main { padding:12px; max-width:720px; margin:auto; }
  .card { background:var(--c); border-radius:12px; padding:12px; margin-bottom:10px; box-shadow:0 1px 2px #0002; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; background:#e0e6da; margin-left:4px; }
  .badge.warn { background:#ffe0b2; } .badge.over { background:var(--r); color:#fff; }
  .muted { color:#666; font-size:14px; }
  input, select, textarea { width:100%; font:inherit; padding:8px; margin:4px 0 10px; border:1px solid #ccc; border-radius:8px; }
  label { font-size:13px; color:#555; }
  img.photo { max-width:100%; border-radius:8px; margin-top:6px; }
  .log { border-top:1px solid #eee; padding:8px 0; }
</style>
</head>
<body>
<header><button class="sec" id="back" hidden>←</button><h1 id="title">Plantendagboek</h1><button id="add">+ Plant</button></header>
<main id="app"></main>
<script>
const $ = (s) => document.querySelector(s);
const TYPES = { water:'💧 Water', feed:'🌿 Voeding', repot:'🪴 Verpot', prune:'✂️ Gesnoeid', note:'📝 Notitie', photo:'📷 Foto' };
const api = async (path, opts = {}) => {
  const isForm = opts.body instanceof FormData;
  const res = await fetch('api/' + path, {
    ...opts,
    headers: isForm || !opts.body ? {} : { 'Content-Type': 'application/json' },
    body: isForm || !opts.body ? opts.body : JSON.stringify(opts.body),
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.status === 204 ? null : res.json();
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const fmt = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString('nl-NL', { day:'numeric', month:'short' }) : '–';
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

function statusBadge(p) {
  if (p.days_overdue === null) return '<span class="badge">nog niet water gegeven</span>';
  if (p.days_overdue > 0) return `<span class="badge over">${p.days_overdue}d te laat</span>`;
  if (p.days_overdue === 0) return '<span class="badge warn">vandaag</span>';
  return `<span class="badge">${fmt(p.next_water)}</span>`;
}
const toxic = (p) => (p.toxic_cat ? '<span class="badge warn">🐱 giftig</span>' : '') + (p.toxic_child ? '<span class="badge warn">👶 giftig</span>' : '');

async function showList() {
  $('#back').hidden = true; $('#title').textContent = 'Plantendagboek';
  const plants = await api('plants');
  plants.sort((a, b) => (b.days_overdue ?? -999) - (a.days_overdue ?? -999));
  $('#app').innerHTML = plants.map((p) => `
    <div class="card" data-id="${p.id}">
      <div class="row"><strong>${esc(p.name)}</strong>${statusBadge(p)}</div>
      <div class="muted">${esc(p.species_name || '')} · ${esc(p.room || '')} ${toxic(p)}</div>
      <div class="row" style="margin-top:8px"><span class="muted">${esc(p.location_note || '')}</span>
        <button data-water="${p.id}">💧 Water gegeven</button></div>
    </div>`).join('') || '<p>Nog geen planten.</p>';
  document.querySelectorAll('[data-water]').forEach((b) => b.onclick = async (e) => {
    e.stopPropagation(); await api(`plants/${b.dataset.water}/logs`, { method:'POST', body:{ type:'water' } }); showList();
  });
  document.querySelectorAll('.card').forEach((c) => c.onclick = () => showPlant(c.dataset.id));
}

async function showPlant(id) {
  const [p, species] = await Promise.all([api('plants/' + id), api('species')]);
  $('#back').hidden = false; $('#title').textContent = p.name;
  const opts = species.map((s) => `<option value="${s.id}" ${s.id === p.species_id ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  $('#app').innerHTML = `
    <div class="card">
      <div class="row"><span>Volgende water: <strong>${fmt(p.next_water)}</strong> ${statusBadge(p)}</span></div>
      <div class="muted">Laatst water: ${fmt(p.last_watered)} · voeding: ${fmt(p.last_fed)} · verpot: ${fmt(p.last_repotted)}</div>
      <div class="muted">${toxic(p)}</div>
    </div>
    <div class="card"><h3>Loggen</h3>
      <form id="log">
        <select name="type">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
        <input type="date" name="date" value="${today()}">
        <select name="outcome"><option value="">Resultaat: n.v.t.</option><option value="good">👍 Werkt</option><option value="bad">👎 Werkt niet</option></select>
        <textarea name="note" rows="2" placeholder="Notitie"></textarea>
        <input type="file" name="photo" accept="image/*" capture="environment">
        <button>Opslaan</button>
      </form></div>
    <div class="card"><h3>Schema & gegevens</h3>
      <form id="edit">
        <label>Naam</label><input name="name" value="${esc(p.name)}">
        <label>Soort</label><select name="species_id"><option value="">–</option>${opts}</select>
        <label>Waterinterval overschrijven (dagen, leeg = soort/seizoen)</label><input name="water_interval_override" type="number" min="1" value="${p.water_interval_override ?? ''}">
        <label>Volgende water handmatig (datum)</label><input name="next_water_override" type="date" value="${p.next_water_override ?? ''}">
        <label>Kamer</label><input name="room" value="${esc(p.room)}">
        <label>Licht</label><input name="light" value="${esc(p.light)}">
        <label>Plek</label><input name="location_note" value="${esc(p.location_note)}">
        <label>Grondsoort</label><input name="soil" value="${esc(p.soil)}">
        <label>Pot</label><input name="pot" value="${esc(p.pot)}">
        <label>Aangeschaft</label><input name="acquired" type="date" value="${p.acquired ?? ''}">
        <label>Giftig voor kat</label><select name="toxic_cat"><option value="">Zoals soort</option><option value="1" ${p.toxic_cat == 1 ? 'selected' : ''}>Ja</option><option value="0">Nee</option></select>
        <label>Giftig voor kind</label><select name="toxic_child"><option value="">Zoals soort</option><option value="1" ${p.toxic_child == 1 ? 'selected' : ''}>Ja</option><option value="0">Nee</option></select>
        <button>Opslaan</button>
      </form></div>
    <h3>Dagboek</h3>
    ${p.logs.map((l) => `<div class="card log"><div class="row"><strong>${TYPES[l.type]}</strong><span class="muted">${fmt(l.date)} ${l.outcome === 'good' ? '👍' : l.outcome === 'bad' ? '👎' : ''}</span></div>
      ${l.note ? `<div>${esc(l.note)}</div>` : ''}${l.photo ? `<img class="photo" src="photos/${esc(l.photo)}">` : ''}
      <button class="sec" data-del="${l.id}">Verwijder</button></div>`).join('') || '<p class="muted">Nog geen berichten.</p>'}`;
  $('#log').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target);
    if (!f.get('photo')?.size) f.delete('photo');
    for (const [k, v] of [...f]) if (v === '') f.delete(k);
    await api(`plants/${id}/logs`, { method:'POST', body:f }).catch((x) => alert(x.message)); showPlant(id);
  };
  $('#edit').onsubmit = async (e) => {
    e.preventDefault(); const body = Object.fromEntries(new FormData(e.target));
    await api('plants/' + id, { method:'PATCH', body }).catch((x) => alert(x.message)); showPlant(id);
  };
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => {
    if (confirm('Verwijderen?')) { await api(`plants/${id}/logs/${b.dataset.del}`, { method:'DELETE' }); showPlant(id); }
  });
}

$('#back').onclick = showList;
$('#add').onclick = async () => {
  const name = prompt('Naam van de plant?'); if (!name) return;
  const p = await api('plants', { method:'POST', body:{ name, acquired: today() } }); showPlant(p.id);
};
showList();
</script>
</body>
</html>
