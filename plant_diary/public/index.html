<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantendagboek</title>
<style>
  :root { --primary:#7aa2be; --bg:#0d1117; --surface:#161b22; --raised:#1c232c; --text:#e6e9ee; --text2:#8b95a3;
    --border:#2a323d; --ok:#76d698; --warn:#e3b341; --err:#ea7287; --r:10px; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--text); background:var(--bg); min-height:100vh; }
  header { background:var(--surface); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; gap:12px; align-items:center; position:sticky; top:0; z-index:2; }
  header h1 { font-size:17px; font-weight:600; margin:0; flex:1; }
  button { font:inherit; font-size:14px; padding:7px 14px; border:1px solid transparent; border-radius:8px; background:var(--primary); color:#0d1117; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  button.sec { background:var(--raised); color:var(--text); border-color:var(--border); font-weight:500; }
  button.danger { background:transparent; color:var(--err); border-color:rgba(234,114,135,.45); font-weight:500; }
  button.danger.armed { background:var(--err); color:#0d1117; }
  button.quiet { background:none; border:0; color:var(--text2); padding:4px 6px; font-size:13px; font-weight:400; }
  button.quiet:hover { color:var(--text); text-decoration:underline; filter:none; }
  main { padding:16px 12px; max-width:720px; margin:auto; }
  main.wide { max-width:1040px; }
  .cols { display:grid; grid-template-columns:1fr; gap:0 16px; align-items:start; }
  @media (min-width:860px) { .cols { grid-template-columns:minmax(0,5fr) minmax(0,7fr); } }
  dialog { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:var(--r); padding:18px; width:min(560px,94vw); max-height:90vh; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; margin-bottom:12px; }
  .card[data-id] { cursor:pointer; transition:border-color .15s; }
  .card[data-id]:hover { border-color:#3a4553; }
  h3 { margin:0 0 10px; font-weight:600; font-size:15px; }
  h3.ttl { margin:0; font-size:18px; }
  .badge.toxic { background:rgba(234,114,135,.08); border-color:rgba(234,114,135,.3); color:#d98a99; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; }
  .badge { font-size:12px; padding:1px 8px; border-radius:6px; background:var(--raised); border:1px solid var(--border); margin-left:0; white-space:nowrap; }
  .badge.warn { background:rgba(227,179,65,.12); border-color:rgba(227,179,65,.35); color:var(--warn); }
  .badge.next { background:rgba(122,162,190,.12); border-color:rgba(122,162,190,.4); color:var(--primary); }
  .badge.over { background:rgba(234,114,135,.12); border-color:rgba(234,114,135,.4); color:var(--err); }
  .muted { color:var(--text2); font-size:14px; }
  input, select, textarea { width:100%; font:inherit; color:var(--text); background:var(--bg); padding:8px 10px; margin:4px 0 12px; border:1px solid var(--border); border-radius:8px; color-scheme:dark; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary); }
  label { font-size:13px; color:var(--text2); }
  img.thumb { display:block; width:84px; height:84px; object-fit:cover; border-radius:8px; margin-top:10px; cursor:pointer; border:1px solid var(--border); }
  img.big { display:block; max-width:100%; max-height:80vh; margin:auto; border-radius:8px; }
  .log { padding:12px 16px; }
  .actions { display:flex; gap:8px; margin-top:4px; }
  .toast { position:fixed; left:12px; right:12px; bottom:16px; max-width:696px; margin:auto; background:var(--err); color:#0d1117; padding:12px 14px; border-radius:8px; z-index:5; }
  .warnbox { background:rgba(227,179,65,.1); border:1px solid rgba(227,179,65,.35); color:var(--warn); border-radius:8px; padding:8px 10px; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:1fr; gap:12px; }
  button.sugg { display:block; width:100%; text-align:left; background:var(--raised); color:var(--text); border-color:var(--border); font-weight:400; margin-bottom:6px; }
</style>
</head>
<body>
<header><button class="sec" id="back" hidden>←</button><h1 id="title">Plantendagboek</h1><button id="add">+ Plant</button></header>
<main id="app"></main>
<script>
const $ = (s) => document.querySelector(s);
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 4000); }
// Two-step delete without a browser dialog: first click arms, second click confirms.
function armDelete(btn, label, action) {
  let armed = false, timer;
  btn.onclick = async (e) => {
    e.stopPropagation();
    if (!armed) { armed = true; btn.textContent = 'Zeker weten?'; btn.classList.add('armed'); timer = setTimeout(() => { armed = false; btn.textContent = label; btn.classList.remove('armed'); }, 3000); return; }
    clearTimeout(timer); await action();
  };
}
const TYPES = { water:'💧 Water', feed:'🌿 Voeding', repot:'🪴 Verpot', prune:'✂️ Gesnoeid', note:'📝 Notitie', };
const api = async (path, opts = {}) => {
  const isForm = opts.body instanceof FormData;
  const res = await fetch('api/' + path, {
    ...opts,
    headers: isForm || !opts.body ? {} : { 'Content-Type': 'application/json' },
    body: isForm || !opts.body ? opts.body : JSON.stringify(opts.body),
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.status === 204 ? null : res.json();
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const fmt = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString('nl-NL', { day:'numeric', month:'short' }) : '–';
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

const LIGHT = { shade:'Volledige schaduw', half_shade:'Halfschaduw', indirect:'Indirect licht', full_sun:'Vol zonlicht' };
const SOIL = { standard:'Standaard potgrond', cactus:'Cactus- en succulentengrond', aroid:'Aroid mix', orchid:'Orchideeëngrond' };
const opt = (map, sel, blank) => (blank ? `<option value="">${blank}</option>` : '') +
  Object.entries(map).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v}</option>`).join('');

// One badge for watering: overdue/today, the next date (future, blue) or the last date (past, grey).
function statusBadge(p) {
  if (!p.last_watered) return '<span class="badge">Nog geen water gegeven</span>';
  if (p.days_overdue > 0) return `<span class="badge over">💧 ${p.days_overdue}d te laat</span>`;
  if (p.days_overdue === 0) return '<span class="badge warn">💧 vandaag</span>';
  if (p.next_water) return `<span class="badge next">💧 ${fmt(p.next_water)}</span>`;
  return `<span class="badge">Laatst water: ${fmt(p.last_watered)}</span>`;
}
const needsWater = (p) => p.days_overdue === null || p.days_overdue >= 0;
function modal(title, html) {
  const d = document.createElement('dialog');
  d.innerHTML = `<div class="row"><h3>${title}</h3><button type="button" class="sec" data-x>✕</button></div>${html}`;
  document.body.append(d); d.addEventListener('close', () => d.remove());
  d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
  d.querySelector('[data-x]').onclick = () => d.close(); d.showModal(); return d;
}
const lightBadge = (p) => p.light_status === 'too_bright' ? '<span class="badge warn">☀️ te licht</span>'
  : p.light_status === 'too_dark' ? '<span class="badge warn">🌑 te donker</span>' : '';
const speciesLine = (p) => [p.latin_name || p.species_name, p.name_nl].filter(Boolean).map(esc).join(' · ');
const lightRange = (s) => !s.light_min && !s.light_max ? '–'
  : s.light_min === s.light_max ? LIGHT[s.light_min] : `${LIGHT[s.light_min] ?? '…'} t/m ${LIGHT[s.light_max] ?? '…'}`;

/** Summary block shared by the overview cards and the plant page; `detail` adds schedule dates and an edit link. */
function plantBlock(p, detail = false) {
  const where = [p.room, p.location_note].filter(Boolean).map(esc).join(' - ');
  const place = [where, p.light_level ? `(${LIGHT[p.light_level]})` : ''].filter(Boolean).join(' ');
  const dates = detail ? [['Voeding', p.last_fed], ['Verpot', p.last_repotted]]
    .filter(([, d]) => d).map(([l, d]) => `<div class="muted">${l}: ${fmt(d)}</div>`).join('') : '';
  const line = (html) => (html ? `<div class="muted">${html}</div>` : '');
  return `<div class="row"><h3 class="ttl">${esc(p.name)}</h3>${detail ? '<button class="quiet" id="openedit">Bewerk</button>' : ''}</div>
    ${line(speciesLine(p))}
    <div style="margin:6px 0">${statusBadge(p)}</div>
    ${dates}${line(place)}${line(p.pot ? 'Pot: ' + (isNaN(p.pot) ? esc(p.pot) : p.pot + ' cm') : '')}
    ${line(lightBadge(p))}
    ${p.photo ? `<img class="thumb" ${detail ? 'id="thumb" ' : ''}src="photos/${esc(p.photo)}" alt="">` : ''}`;
}

async function showList() {
  $('#back').hidden = true; $('#title').textContent = 'Plantendagboek'; $('#app').className = '';
  const plants = await api('plants');
  plants.sort((a, b) => (b.days_overdue ?? -999) - (a.days_overdue ?? -999));
  $('#app').innerHTML = plants.map((p) => `
    <div class="card" data-id="${p.id}">
      ${plantBlock(p)}
      ${needsWater(p) ? `<div class="actions" style="margin-top:8px"><button data-water="${p.id}">💧 Water gegeven</button></div>` : ''}
    </div>`).join('') || '<p>Nog geen planten.</p>';
  document.querySelectorAll('[data-water]').forEach((b) => b.onclick = async (e) => {
    e.stopPropagation(); await api(`plants/${b.dataset.water}/logs`, { method:'POST', body:{ type:'water' } }); showList();
  });
  document.querySelectorAll('.card').forEach((c) => c.onclick = () => showPlant(c.dataset.id));
  $('#app').insertAdjacentHTML('beforeend', '<div style="margin-top:24px;text-align:center"><button class="quiet" id="reset">Database leegmaken</button></div>');
  armDelete($('#reset'), 'Database leegmaken', async () => {
    await api('reset', { method:'POST' }).catch((x) => toast(x.message)); showList();
  });
}

function infoBlock(p) {
  const s = p.species;
  if (!s) return '<div class="card"><h3 class="ttl">Informatie &amp; verzorging</h3><p class="muted">Geen soort gekoppeld. Kies hieronder een soort.</p></div>';
  const tip = (label, v) => `<div><span class="muted">${label}</span><br>${v ? esc(v) : '<span class="muted">nog niet ingevuld</span>'}</div>`;
  const water = s.water_summer_days ? `elke ${s.water_summer_days} dagen (zomer) · ${s.water_winter_days ?? s.water_summer_days} dagen (winter)` : '';
  const mismatch = p.light_status === 'too_bright' || p.light_status === 'too_dark'
    ? `<div class="warnbox">${p.light_status === 'too_bright' ? 'Staat te licht' : 'Staat te donker'}: nu <strong>${LIGHT[p.light_level]}</strong>, ideaal <strong>${lightRange(s)}</strong>.</div>` : '';
  return `<div class="card info"><div class="row"><h3 class="ttl">Informatie &amp; verzorging</h3><button class="quiet" id="editspecies">Bewerk</button></div>
    ${p.toxic ? '<div style="margin-bottom:10px"><span class="badge toxic" style="margin-left:0">Giftig voor huisdieren en mensen</span></div>' : ''}
    ${mismatch}
    ${s.description ? `<p>${esc(s.description)}</p>` : ''}
    <div class="grid">
      ${tip('Water', water)}
      ${tip('Standplaats', lightRange(s) === '–' ? '' : lightRange(s))}
      ${tip('Grond', SOIL[p.soil_effective])}
      ${tip('Voeding', s.feed_tip)}
      ${tip('Verpotten', s.repot_tip)}
      ${tip('Snoeien', s.prune_tip)}
    </div></div>`;
}

async function showPlant(id) {
  const [p, species] = await Promise.all([api('plants/' + id), api('species')]);
  $('#back').hidden = false; $('#title').textContent = p.name; $('#app').className = 'wide';
  const opts = species.map((s) => `<option value="${s.id}" ${s.id === p.species_id ? 'selected' : ''}>${esc(s.latin_name || s.name)}${s.name_nl ? ' (' + esc(s.name_nl) + ')' : ''}</option>`).join('');
  const logForm = (l) => `<form id="log">
        <select name="type">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${l && l.type === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <input type="date" name="date" value="${l ? l.date : today()}">
        <textarea name="note" rows="3" placeholder="Notitie">${l ? esc(l.note) : ''}</textarea>
        <div class="actions"><button>Opslaan</button>${l ? '<button type="button" class="danger" id="dellog">Verwijder bericht</button>' : ''}</div></form>`;
  const editForm = `<form id="edit">
        <label>Naam</label><input name="name" value="${esc(p.name)}">
        <label>Soort</label><select name="species_id"><option value="">–</option>${opts}</select>
        <label>Volgende water handmatig (datum)</label><input name="next_water_override" type="date" value="${p.next_water_override ?? ''}">
        <label>Standplaats (waar staat de plant nu?)</label><select name="light_level">${opt(LIGHT, p.light_level, '– kies –')}</select>
        <label>Kamer</label><input name="room" value="${esc(p.room)}">
        <label>Plek</label><input name="location_note" value="${esc(p.location_note)}">
        ${p.light ? `<label>Eerdere lichtnotitie</label><input name="light" value="${esc(p.light)}">` : ''}
        <label>Foto</label><input type="file" id="photofile" accept="image/*">
        ${p.photo ? '<button type="button" class="quiet" id="delphoto">Foto verwijderen</button>' : ''}
        <label>Pot (diameter in cm)</label><input name="pot" type="number" min="1" max="200" step="0.5" value="${isNaN(p.pot) ? '' : p.pot ?? ''}">
        <label>Aangeschaft</label><input name="acquired" type="date" value="${p.acquired ?? ''}">
        <div class="actions"><button>Opslaan</button><button type="button" class="danger" id="delplant">Plant verwijderen</button></div>
      </form>`;
  $('#app').innerHTML = `
    <div class="cols"><div>
    <div class="card">
      ${plantBlock(p, true)}
    </div>
    </div><div>${infoBlock(p)}</div></div>
    <div class="row" style="margin-top:16px"><h3 style="margin:0">Dagboek</h3><button id="openlog">Schrijf update</button></div>
    <div style="height:10px"></div>
    ${p.logs.map((l) => `<div class="card log"><div class="row"><strong>${TYPES[l.type]}</strong><span class="muted">${fmt(l.date)}</span></div>
      ${l.note ? `<div>${esc(l.note)}</div>` : ''}
      <div style="text-align:right"><button type="button" class="quiet" data-editlog="${l.id}">bewerken</button></div></div>`).join('') || '<p class="muted">Nog geen berichten.</p>'}`;
  if ($('#thumb')) $('#thumb').onclick = () => modal('', `<img class="big" src="photos/${esc(p.photo)}" alt="">`);
  if ($('#editspecies')) $('#editspecies').onclick = () => editSpecies(p);
  $('#openlog').onclick = () => {
    const d = modal('Update schrijven', logForm());
    d.querySelector('#log').onsubmit = async (e) => {
      e.preventDefault();
      const body = Object.fromEntries([...new FormData(e.target)].filter(([, v]) => v !== ''));
      await api(`plants/${id}/logs`, { method:'POST', body }).catch((x) => toast(x.message)); d.close(); showPlant(id);
    };
  };
  $('#openedit').onclick = () => {
    const d = modal('Plant aanpassen', editForm);
    d.querySelector('#edit').onsubmit = async (e) => {
      e.preventDefault(); const body = Object.fromEntries(new FormData(e.target));
      const file = d.querySelector('#photofile').files[0];
      try {
        await api('plants/' + id, { method:'PATCH', body });
        if (file) { const f = new FormData(); f.append('photo', file); await api(`plants/${id}/photo`, { method:'POST', body:f }); }
      } catch (x) { return toast(x.message); }
      d.close(); showPlant(id);
    };
    const dp = d.querySelector('#delphoto');
    if (dp) dp.onclick = async () => { await api(`plants/${id}/photo`, { method:'DELETE' }).catch((x) => toast(x.message)); d.close(); showPlant(id); };
    armDelete(d.querySelector('#delplant'), 'Plant verwijderen', async () => {
      await api('plants/' + id, { method:'DELETE' }).catch((x) => toast(x.message)); d.close(); showList();
    });
  };
  document.querySelectorAll('[data-editlog]').forEach((b) => b.onclick = () => {
    const l = p.logs.find((x) => x.id == b.dataset.editlog);
    const d = modal('Bericht bewerken', logForm(l));
    d.querySelector('#log').onsubmit = async (e) => {
      e.preventDefault(); const body = Object.fromEntries(new FormData(e.target));
      await api(`plants/${id}/logs/${l.id}`, { method:'PATCH', body }).catch((x) => toast(x.message)); d.close(); showPlant(id);
    };
    armDelete(d.querySelector('#dellog'), 'Verwijder bericht', async () => {
      await api(`plants/${id}/logs/${l.id}`, { method:'DELETE' }); d.close(); showPlant(id);
    });
  });
}

function editSpecies(p) {
  const s = p.species; $('#app').className = '';
  $('#title').textContent = 'Soort bewerken';
  const txt = (n, l) => `<label>${l}</label><textarea name="${n}" rows="2">${esc(s[n])}</textarea>`;
  $('#app').innerHTML = `<div class="card"><p class="muted">Wijzigingen gelden voor alle planten van deze soort.</p><form id="sp">
    <label>Latijnse naam</label><input name="latin_name" value="${esc(s.latin_name || s.name)}">
    <label>Nederlandse naam</label><input name="name_nl" value="${esc(s.name_nl)}">
    <label>Engelse naam</label><input name="name_en" value="${esc(s.name_en)}">
    <label>Water zomer (dagen)</label><input name="water_summer_days" type="number" min="1" value="${s.water_summer_days ?? ''}">
    <label>Water winter (dagen)</label><input name="water_winter_days" type="number" min="1" value="${s.water_winter_days ?? ''}">
    <label>Licht minimaal</label><select name="light_min">${opt(LIGHT, s.light_min, '–')}</select>
    <label>Licht maximaal</label><select name="light_max">${opt(LIGHT, s.light_max, '–')}</select>
    <label>Grondsoort</label><select name="soil">${opt(SOIL, s.soil, '–')}</select>
    <label>Giftig</label><select name="toxic"><option value="0" ${!(s.toxic_pets || s.toxic_humans) ? 'selected' : ''}>Nee</option><option value="1" ${s.toxic_pets || s.toxic_humans ? 'selected' : ''}>Ja</option></select>
    ${txt('feed_tip', 'Voeding')}${txt('repot_tip', 'Verpotten')}${txt('prune_tip', 'Snoeien')}${txt('description', 'Omschrijving')}
    <div class="actions"><button>Opslaan</button><button type="button" class="sec" id="cancel">Annuleren</button></div>
  </form></div>`;
  $('#cancel').onclick = () => showPlant(p.id);
  $('#sp').onsubmit = async (e) => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target));
    body.toxic_pets = body.toxic_humans = body.toxic; delete body.toxic;
    const r = await api('species/' + s.id, { method:'PATCH', body }).catch((x) => toast(x.message));
    if (r) showPlant(p.id);
  };
}

$('#back').onclick = showList;
$('#add').onclick = () => {
  $('#app').className = '';
  $('#back').hidden = false; $('#title').textContent = 'Nieuwe plant';
  let chosen = null, timer;
  $('#app').innerHTML = `<div class="card"><form id="new">
    <label>Soort zoeken (Latijns, Nederlands of Engels)</label>
    <input id="q" autocomplete="off" placeholder="bijv. sanse, monstera, orchidee">
    <div id="sugg"></div>
    <div id="chosen" class="muted"></div>
    <div class="actions" style="margin-bottom:12px"><button type="button" class="sec" id="own">Eigen soort aanmaken</button></div>
    <label>Naam van de plant</label><input name="name" required>
    <label>Standplaats</label><select name="light_level">${opt(LIGHT, '', '– kies –')}</select>
    <label>Kamer</label><input name="room">
    <label>Plek</label><input name="location_note">
    <label>Pot (diameter in cm)</label><input name="pot" type="number" min="1" max="200" step="0.5" inputmode="decimal">
    <label>Aangeschaft</label><input name="acquired" type="date" value="${today()}">
    <div class="actions"><button>Toevoegen</button><button type="button" class="sec" id="cancel">Annuleren</button></div>
  </form></div>`;
  const form = $('#new');
  const pick = (s, note) => {
    chosen = s; $('#sugg').innerHTML = '';
    $('#chosen').innerHTML = `Gekozen: <strong>${esc(s.latin_name || s.name)}</strong>${s.name_nl ? ' · ' + esc(s.name_nl) : ''}${note ? `<br>${esc(note)}` : ''}`;
    if (!form.name.value) form.name.value = s.name_nl || s.latin_name || s.name;
  };
  const choose = async (it) => {
    if (it.id) return pick(it);
    $('#chosen').textContent = 'Soort opslaan…';
    try { const r = await api('species/resolve', { method:'POST', body: it }); pick(r.species, r.created ? 'Nieuwe soort: vul de verzorgingsgegevens in via "Bewerk soort" op de plantpagina.' : ''); }
    catch (x) { $('#chosen').textContent = ''; toast(x.message); }
  };
  const label = (s) => `<strong>${esc(s.latin_name || s.name)}</strong> <span class="muted">${esc([s.name_nl, s.name_en].filter(Boolean).join(' · '))}${s.id ? ' · opgeslagen' : ''}</span>`;
  $('#q').oninput = (e) => {
    clearTimeout(timer); const q = e.target.value.trim();
    if (q.length < 3) { $('#sugg').innerHTML = ''; return; }
    timer = setTimeout(async () => {
      const r = await api('names/suggest?q=' + encodeURIComponent(q)).catch((x) => (toast(x.message), null));
      if (!r || $('#q').value.trim() !== q) return;
      const items = [...r.local, ...r.online];
      $('#sugg').innerHTML = items.map((s, i) => `<button type="button" class="sugg" data-i="${i}">${label(s)}</button>`).join('')
        || `<div class="muted" style="margin-bottom:8px">Geen resultaten${r.offline ? ' (online zoeken niet bereikbaar)' : ''}.</div>`;
      document.querySelectorAll('.sugg').forEach((b) => b.onclick = () => choose(items[b.dataset.i]));
    }, 300);
  };
  $('#own').onclick = async () => {
    const name = $('#q').value.trim();
    if (name.length < 2) return toast('Typ eerst de naam van de soort in het zoekveld');
    const s = await api('species', { method:'POST', body:{ name, latin_name: name } }).catch((x) => toast(x.message));
    if (s) pick(s);
  };
  $('#cancel').onclick = showList;
  form.onsubmit = async (e) => {
    e.preventDefault();
    const body = Object.fromEntries([...new FormData(form)].filter(([, v]) => v !== ''));
    if (chosen) body.species_id = chosen.id;
    const p = await api('plants', { method:'POST', body }).catch((x) => toast(x.message));
    if (p) showPlant(p.id);
  };
};
showList();
</script>
</body>
</html>
