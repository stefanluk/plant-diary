<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantendagboek</title>
<style>
  :root { --primary:rgb(122,162,190); --bg:rgb(2,6,11); --text:rgba(234,235,238,.98); --text2:rgba(234,235,238,.7);
    --card:rgba(255,255,255,.06); --border:rgba(234,235,238,.22); --divider:rgba(90,111,128,.28);
    --ok:rgb(118,214,152); --warn:rgb(255,219,117); --err:rgb(234,114,135); --r:18px; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--text);
    background:radial-gradient(1200px 700px at 15% -10%,rgba(122,162,190,.22),transparent 60%),radial-gradient(900px 600px at 100% 0,rgba(118,214,152,.10),transparent 55%),var(--bg) fixed; min-height:100vh; }
  header { background:rgba(2,6,11,.55); backdrop-filter:blur(8px) saturate(1.1); border-bottom:1px solid var(--divider); padding:12px 16px; display:flex; gap:12px; align-items:center; position:sticky; top:0; z-index:2; }
  header h1 { font-size:18px; font-weight:500; margin:0; flex:1; }
  button { font:inherit; padding:8px 14px; border:0; border-radius:12px; background:var(--primary); color:#02060b; font-weight:500; cursor:pointer; }
  button.sec { background:rgba(234,235,238,.12); color:var(--text); }
  button.danger { background:rgba(234,114,135,.16); color:var(--err); border:1px solid rgba(234,114,135,.5); }
  button.danger.armed { background:var(--err); color:#02060b; }
  main { padding:12px; max-width:720px; margin:auto; }
  .card { background:var(--card); backdrop-filter:blur(10px) saturate(1.25); border:.5px solid var(--border); border-radius:var(--r); padding:14px; margin-bottom:12px;
    box-shadow:3px 3px .5px -3.5px rgba(255,255,255,.3) inset,-2px -2px .5px -2px rgba(255,255,255,.2) inset,0 4px 16px rgba(0,0,0,.35); }
  .card[data-id] { cursor:pointer; }
  h3 { margin:0 0 10px; font-weight:500; font-size:16px; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; }
  .badge { font-size:12px; padding:2px 9px; border-radius:99px; background:rgba(234,235,238,.12); margin-left:4px; white-space:nowrap; }
  .badge.warn { background:rgba(255,219,117,.18); color:var(--warn); } .badge.over { background:rgba(234,114,135,.22); color:var(--err); }
  .muted { color:var(--text2); font-size:14px; }
  input, select, textarea { width:100%; font:inherit; color:var(--text); background:rgba(2,6,11,.45); padding:9px 10px; margin:4px 0 12px; border:1px solid var(--divider); border-radius:12px; color-scheme:dark; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary); }
  label { font-size:13px; color:var(--text2); }
  img.photo { max-width:100%; border-radius:12px; margin-top:6px; }
  .log { padding:12px 14px; }
  .actions { display:flex; gap:8px; margin-top:4px; }
  .toast { position:fixed; left:12px; right:12px; bottom:16px; max-width:696px; margin:auto; background:rgba(234,114,135,.95); color:#02060b; padding:12px 14px; border-radius:12px; z-index:5; }
</style>
</head>
<body>
<header><button class="sec" id="back" hidden>←</button><h1 id="title">Plantendagboek</h1><button id="add">+ Plant</button></header>
<main id="app"></main>
<script>
const $ = (s) => document.querySelector(s);
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 4000); }
// Two-step delete without a browser dialog: first click arms, second click confirms.
function armDelete(btn, label, action) {
  let armed = false, timer;
  btn.onclick = async (e) => {
    e.stopPropagation();
    if (!armed) { armed = true; btn.textContent = 'Zeker weten?'; btn.classList.add('armed'); timer = setTimeout(() => { armed = false; btn.textContent = label; btn.classList.remove('armed'); }, 3000); return; }
    clearTimeout(timer); await action();
  };
}
const TYPES = { water:'💧 Water', feed:'🌿 Voeding', repot:'🪴 Verpot', prune:'✂️ Gesnoeid', note:'📝 Notitie', photo:'📷 Foto' };
const api = async (path, opts = {}) => {
  const isForm = opts.body instanceof FormData;
  const res = await fetch('api/' + path, {
    ...opts,
    headers: isForm || !opts.body ? {} : { 'Content-Type': 'application/json' },
    body: isForm || !opts.body ? opts.body : JSON.stringify(opts.body),
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.status === 204 ? null : res.json();
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const fmt = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString('nl-NL', { day:'numeric', month:'short' }) : '–';
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

function statusBadge(p) {
  if (p.days_overdue === null) return '<span class="badge">nog niet water gegeven</span>';
  if (p.days_overdue > 0) return `<span class="badge over">${p.days_overdue}d te laat</span>`;
  if (p.days_overdue === 0) return '<span class="badge warn">vandaag</span>';
  return `<span class="badge">${fmt(p.next_water)}</span>`;
}
const toxic = (p) => (p.toxic_cat ? '<span class="badge warn">🐱 giftig</span>' : '') + (p.toxic_child ? '<span class="badge warn">👶 giftig</span>' : '');

async function showList() {
  $('#back').hidden = true; $('#title').textContent = 'Plantendagboek';
  const plants = await api('plants');
  plants.sort((a, b) => (b.days_overdue ?? -999) - (a.days_overdue ?? -999));
  $('#app').innerHTML = plants.map((p) => `
    <div class="card" data-id="${p.id}">
      <div class="row"><strong>${esc(p.name)}</strong>${statusBadge(p)}</div>
      <div class="muted">${esc(p.species_name || '')} · ${esc(p.room || '')} ${toxic(p)}</div>
      <div class="row" style="margin-top:8px"><span class="muted">${esc(p.location_note || '')}</span>
        <button data-water="${p.id}">💧 Water gegeven</button></div>
    </div>`).join('') || '<p>Nog geen planten.</p>';
  document.querySelectorAll('[data-water]').forEach((b) => b.onclick = async (e) => {
    e.stopPropagation(); await api(`plants/${b.dataset.water}/logs`, { method:'POST', body:{ type:'water' } }); showList();
  });
  document.querySelectorAll('.card').forEach((c) => c.onclick = () => showPlant(c.dataset.id));
}

async function showPlant(id) {
  const [p, species] = await Promise.all([api('plants/' + id), api('species')]);
  $('#back').hidden = false; $('#title').textContent = p.name;
  const opts = species.map((s) => `<option value="${s.id}" ${s.id === p.species_id ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  $('#app').innerHTML = `
    <div class="card">
      <div class="row"><span>Volgende water: <strong>${fmt(p.next_water)}</strong> ${statusBadge(p)}</span></div>
      <div class="muted">Laatst water: ${fmt(p.last_watered)} · voeding: ${fmt(p.last_fed)} · verpot: ${fmt(p.last_repotted)}</div>
      <div class="muted">${toxic(p)}</div>
    </div>
    <div class="card"><h3>Loggen</h3>
      <form id="log">
        <select name="type">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
        <input type="date" name="date" value="${today()}">
        <select name="outcome"><option value="">Resultaat: n.v.t.</option><option value="good">👍 Werkt</option><option value="bad">👎 Werkt niet</option></select>
        <textarea name="note" rows="2" placeholder="Notitie"></textarea>
        <input type="file" name="photo" accept="image/*" capture="environment">
        <button>Opslaan</button>
      </form></div>
    <div class="card"><h3>Schema & gegevens</h3>
      <form id="edit">
        <label>Naam</label><input name="name" value="${esc(p.name)}">
        <label>Soort</label><select name="species_id"><option value="">–</option>${opts}</select>
        <label>Waterinterval overschrijven (dagen, leeg = soort/seizoen)</label><input name="water_interval_override" type="number" min="1" value="${p.water_interval_override ?? ''}">
        <label>Volgende water handmatig (datum)</label><input name="next_water_override" type="date" value="${p.next_water_override ?? ''}">
        <label>Kamer</label><input name="room" value="${esc(p.room)}">
        <label>Licht</label><input name="light" value="${esc(p.light)}">
        <label>Plek</label><input name="location_note" value="${esc(p.location_note)}">
        <label>Grondsoort</label><input name="soil" value="${esc(p.soil)}">
        <label>Pot</label><input name="pot" value="${esc(p.pot)}">
        <label>Aangeschaft</label><input name="acquired" type="date" value="${p.acquired ?? ''}">
        <label>Giftig voor kat</label><select name="toxic_cat"><option value="">Zoals soort</option><option value="1" ${p.toxic_cat == 1 ? 'selected' : ''}>Ja</option><option value="0">Nee</option></select>
        <label>Giftig voor kind</label><select name="toxic_child"><option value="">Zoals soort</option><option value="1" ${p.toxic_child == 1 ? 'selected' : ''}>Ja</option><option value="0">Nee</option></select>
        <div class="actions"><button>Opslaan</button><button type="button" class="danger" id="delplant">🗑 Plant verwijderen</button></div>
      </form></div>
    <h3>Dagboek</h3>
    ${p.logs.map((l) => `<div class="card log"><div class="row"><strong>${TYPES[l.type]}</strong><span class="muted">${fmt(l.date)} ${l.outcome === 'good' ? '👍' : l.outcome === 'bad' ? '👎' : ''}</span></div>
      ${l.note ? `<div>${esc(l.note)}</div>` : ''}${l.photo ? `<img class="photo" src="photos/${esc(l.photo)}">` : ''}
      <button type="button" class="danger" data-del="${l.id}">Verwijder</button></div>`).join('') || '<p class="muted">Nog geen berichten.</p>'}`;
  $('#log').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target);
    if (!f.get('photo')?.size) f.delete('photo');
    for (const [k, v] of [...f]) if (v === '') f.delete(k);
    await api(`plants/${id}/logs`, { method:'POST', body:f }).catch((x) => toast(x.message)); showPlant(id);
  };
  $('#edit').onsubmit = async (e) => {
    e.preventDefault(); const body = Object.fromEntries(new FormData(e.target));
    await api('plants/' + id, { method:'PATCH', body }).catch((x) => toast(x.message)); showPlant(id);
  };
  document.querySelectorAll('[data-del]').forEach((b) => armDelete(b, 'Verwijder', async () => {
    await api(`plants/${id}/logs/${b.dataset.del}`, { method:'DELETE' }); showPlant(id);
  }));
  armDelete($('#delplant'), '🗑 Plant verwijderen', async () => {
    await api('plants/' + id, { method:'DELETE' }).catch((x) => toast(x.message)); showList();
  });
}

$('#back').onclick = showList;
$('#add').onclick = async () => {
  const species = await api('species');
  $('#back').hidden = false; $('#title').textContent = 'Nieuwe plant';
  $('#app').innerHTML = `<div class="card"><form id="new">
    <label>Naam</label><input name="name" required autofocus>
    <label>Soort</label><select name="species_id"><option value="">–</option>${species.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
    <label>Kamer</label><input name="room">
    <label>Plek</label><input name="location_note">
    <label>Aangeschaft</label><input name="acquired" type="date" value="${today()}">
    <div class="actions"><button>Toevoegen</button><button type="button" class="sec" id="cancel">Annuleren</button></div>
  </form></div>`;
  $('#cancel').onclick = showList;
  $('#new').onsubmit = async (e) => {
    e.preventDefault();
    const body = Object.fromEntries([...new FormData(e.target)].filter(([, v]) => v !== ''));
    const p = await api('plants', { method:'POST', body }).catch((x) => toast(x.message));
    if (p) showPlant(p.id);
  };
};
showList();
</script>
</body>
</html>
